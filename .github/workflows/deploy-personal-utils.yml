name: Deploy Personal Utils

on:
  push:
    branches:
      - main
    paths:
      - "apps/personal-utils/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/personal-utils
    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          working_directory: apps/personal-utils

      - name: Install dependencies
        run: just install

      - name: Build
        run: just build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/personal-utils/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
