services:
  money-manager-backend:
    build:
      context: ./apps/money-manager
      dockerfile: backend/Dockerfile.prod
    container_name: money-manager-backend
    restart: unless-stopped
    environment:
      - DATA_PATH=/app/data/snapshots.json
      - FEES_PATH=/app/data/fees.json
      - PORTFOLIO_PATH=/app/data/portfolio.json
      - PORTFOLIO_TARGETS_PATH=/app/data/portfolio-targets.json
    volumes:
      - ${MONEY_MANAGER_DATA_DIR:-./apps/money-manager/data}:/app/data

  money-manager-frontend:
    build:
      context: ./apps/money-manager
      dockerfile: frontend/Dockerfile.prod
      args:
        VITE_BASE_PATH: ${MONEY_MANAGER_BASE_PATH:-/money-manager/}
    container_name: money-manager-frontend
    restart: unless-stopped
    depends_on:
      - money-manager-backend

  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    ports:
      # DNS Ports
      - "53:53/tcp"
      - "53:53/udp"
      # Default HTTP Port
      - "8080:80/tcp"
      - "443:443/tcp"
    environment:
      TZ: 'Israel/Jerusalem'
      FTLCONF_webserver_api_password: ${PIHOLE_PASSWORD}
      FTLCONF_dns_listeningMode: 'all'
      FTLCONF_webserver_paths_prefix: '/pihole'
    volumes:
      - '/opt/pihole:/etc/pihole'
    cap_add:
      - SYS_NICE
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - pihole
      - money-manager-frontend
    restart: 'unless-stopped'
