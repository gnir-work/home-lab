services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: ${UID}:${GID}
    network_mode: 'host'
    volumes:
      - /opt/jellyfin/config:/config
      - /opt/jellyfin/cache:/cache
      - type: bind
        source: /opt/jellyfin/media
        target: /media
      - type: bind
        source: /opt/jellyfin/media2
        target: /media2
        read_only: true
    restart: 'unless-stopped'
    # Optional - may be necessary for docker healthcheck to pass if running in host network mode
    extra_hosts:
      - 'host.docker.internal:host-gateway'
  gluetun:
    image: qmcgaw/gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=expressvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=Canada
  vpn-tester:
    image: busybox
    container_name: vpn-tester
    depends_on:
      - gluetun
    entrypoint: sh
    command: -c "while true; do sleep 999999999999999; done"
    network_mode: "service:gluetun"

  money-manager-backend:
    build:
      context: ./apps/money-manager
      dockerfile: backend/Dockerfile.prod
    container_name: money-manager-backend
    restart: unless-stopped
    environment:
      - DATA_PATH=/app/data/snapshots.json
      - FEES_PATH=/app/data/fees.json
      - PORTFOLIO_PATH=/app/data/portfolio.json
      - PORTFOLIO_TARGETS_PATH=/app/data/portfolio-targets.json
    volumes:
      - ${MONEY_MANAGER_DATA_DIR:-./apps/money-manager/data}:/app/data

  money-manager-frontend:
    build:
      context: ./apps/money-manager
      dockerfile: frontend/Dockerfile.prod
    container_name: money-manager-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - money-manager-backend
